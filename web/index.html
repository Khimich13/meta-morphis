<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MetaMorphis</title>
    <meta name="description" content="Learn the most played Magic: The Gathering cards of a format." />
    <meta name="theme-color" content="#1f2a44" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- iPhones take the home-screen icon from here -->
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <style>
      /* Hidden unless the media rule below applies */
      #rotate-notice {
        display: none;
      }

      /* A phone turned sideways: a touch screen in landscape with little
         height. Tablets and computer windows are taller, so they are left
         alone. Installed apps on Android never get here - the manifest keeps
         them upright. */
      @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
        #app {
          display: none;
        }

        #rotate-notice {
          box-sizing: border-box;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 16px;
          text-align: center;
        }

        #rotate-notice p {
          margin: 4px;
        }

        #rotate-notice p:first-child {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown instead of the app on a phone turned sideways (see the style above) -->
    <div id="rotate-notice">
      <p aria-hidden="true">↻</p>
      <p>Turn your phone upright to use MetaMorphis.</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
