<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: with the solid status bar (see below), the
         page has nothing to draw behind it, and iOS 27 moved its 47px
         between the top safe-area inset and the page's scroll as the phone
         turned, so the full-size card flicked by that much at the end of
         a turn back upright (iPhone, November 2026). Without it, iOS
         leaves plain bands beside the notch in landscape. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMorphis</title>
    <meta
      name="description"
      content="Learn the most played Magic: The Gathering cards of a format."
    />
    <meta name="theme-color" content="#1f2a44" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- iPhones take the home-screen icon from here -->
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <!-- The home-screen app gets a solid status bar (white, or dark in Dark
         Mode) and the page starts below it. Not "black-translucent", which
         draws the page behind the clock and battery: with it, iOS 27
         blurs the top of the screen with no way around it (see the strip
         in src/App.css). iOS reads this only when the icon is added, so
         an installed app needs removing and adding again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Hidden unless the media rule below applies */
      #rotate-notice {
        display: none;
      }

      /* A phone turned sideways: a touch screen in landscape with little
         height. Tablets and computer windows are taller, so they are left
         alone. The card list and the large view are the exceptions
         (landscape-ok, see lib/landscape.ts): there a wide screen shows more
         cards, or a card printed sideways the right way up. */
      @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
        html:not(.landscape-ok) #app {
          display: none;
        }

        html:not(.landscape-ok) #rotate-notice {
          box-sizing: border-box;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 16px;
          text-align: center;
        }

        #rotate-notice p {
          margin: 4px;
        }

        #rotate-notice p:first-child {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown instead of the app on a phone turned sideways (see the style above) -->
    <div id="rotate-notice">
      <p aria-hidden="true">↻</p>
      <p>Turn your phone upright to use MetaMorphis.</p>
    </div>
    <!-- Keeps iOS 27's blur off the top of the home-screen app (see
         .top-strip in src/App.css). A real element that takes taps, not a
         pseudo-element, so iOS finds it: the one that let taps through
         didn't count. -->
    <div class="top-strip" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
