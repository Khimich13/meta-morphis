[project]
name = "meta-morphis"
version = "0.1.0"
description = "MTG meta + Scryfall fetcher"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ruff's default rules (pyflakes and the serious pycodestyle errors),
# plus "I" to sort imports the way isort does
extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meta_morphis"]
