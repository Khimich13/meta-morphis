[project]
name = "meta-morphis"
version = "0.1.0"
description = "MTG meta + Scryfall fetcher"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
