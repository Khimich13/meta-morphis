# Builds the web app and publishes it to GitHub Pages:
# https://khimich13.github.io/meta-morphis/
name: Deploy

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions page
  workflow_dispatch:

# What the workflow is allowed to do: read the code, publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The card data is not in git, so create it here
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Export card data
        run: uv run --no-dev python -m meta_morphis.export

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
